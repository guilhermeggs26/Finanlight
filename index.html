<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanlight">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Finanlight</title>
<style>
/* ===== TEMA ===== */
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--t1:#1D1D1F;--t2:#6E6E73;--t3:#AEAEB2;
  --sep:rgba(60,60,67,.14);--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.07);
  --acc:#0066D6;--acc-s:rgba(0,102,214,.10);
  --ok:#248A3D;--ok-s:rgba(52,199,89,.14);--warn:#B25E00;--warn-s:rgba(255,149,0,.15);--bad:#D70015;--bad-s:rgba(255,59,48,.11);
  --sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --bar:rgba(249,249,251,.78);--seg-on:#FFFFFF;--r:22px;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000;--card:#1C1C1E;--t1:#F5F5F7;--t2:#98989D;--t3:#636366;
  --sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.14);
  --acc:#0A84FF;--acc-s:rgba(10,132,255,.18);
  --ok:#30D158;--ok-s:rgba(48,209,88,.16);--warn:#FFB340;--warn-s:rgba(255,179,64,.16);--bad:#FF453A;--bad-s:rgba(255,69,58,.16);
  --sh:none;--bar:rgba(22,22,24,.74);--seg-on:#636366;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--t1);font:16px/1.4 -apple-system,"SF Pro Display",system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.t2{color:var(--t2)}.t3{color:var(--t3)}.red{color:var(--bad)!important}.okc{color:var(--ok)}
.ic{width:24px;height:24px;flex:none}.ic.s{width:18px;height:18px}

/* ===== LAYOUT ===== */
#app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 8px) calc(16px + env(safe-area-inset-right,0px)) calc(124px + var(--sb)) calc(16px + env(safe-area-inset-left,0px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 4px 16px}
h1{font-size:32px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.1}
.sub{color:var(--t2);font-size:15px;margin-top:2px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.card.flush{padding:2px 0}
.ct{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;margin:24px 6px 8px;min-height:20px}
.ct .link{text-transform:none;letter-spacing:0;font-weight:500;min-height:32px}
.label{font-size:13px;color:var(--t2)}
.row{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 18px;border:0;border-top:.5px solid var(--sep);background:none;width:100%;text-align:left}
.list>.row:first-child,.list>:first-child .row{border-top:0}
button.row:active{background:var(--fill2)}
.grow{flex:1;min-width:0}
.ttl{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{white-space:normal}
.meta{display:block;font-size:14px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta.wrap{white-space:normal}
.amt{font-size:16px;white-space:nowrap;text-align:right}
.r{text-align:right;flex:none}
.chev{width:16px;height:16px;color:var(--t3);flex:none}
.dot{width:8px;height:8px;border-radius:4px;flex:none;background:var(--t3)}
.dot.warn{background:#FF9F0A}.dot.bad{background:#FF3B30}.dot.ok{background:#34C759}
.av{width:36px;height:36px;border-radius:18px;background:var(--fill);display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--t2);flex:none}
.empty{text-align:center;padding:26px 18px}
.empty p{color:var(--t2);margin:0 0 14px;font-size:15px}
.empty .btn{width:auto}

/* ===== BOTÕES / CHIPS ===== */
.btn{appearance:none;border:0;border-radius:14px;min-height:50px;padding:0 20px;font-size:17px;font-weight:600;background:var(--acc);color:#fff;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.sec{background:var(--acc-s);color:var(--acc)}
.btn.ghost{background:none;color:var(--acc)}
.btn.danger{background:var(--bad-s);color:var(--bad)}
.btn.sm{min-height:44px;width:auto;font-size:15px;padding:0 16px;border-radius:22px}
.btns{display:flex;gap:10px;margin-top:14px}.btns .btn{flex:1;padding:0 10px;font-size:16px;white-space:nowrap}
.link{background:none;border:0;color:var(--acc);font-size:16px;min-height:44px;padding:0 4px}
.w60{width:60px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px}
.card .chips{margin:0 -18px;padding:2px 18px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--fill2);font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;position:relative;transition:background .15s,color .15s}
.chip.on{background:var(--acc);color:#fff}
.chip.on .t2{color:rgba(255,255,255,.8)}
.chip.acc{background:var(--acc-s);color:var(--acc);font-weight:500}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border:0;background:none;border-radius:10px;font-size:15px;font-weight:500;transition:background .2s}
.seg .on{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:14px;font-size:13px;font-weight:600;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:3px;background:currentColor}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.n{background:var(--fill);color:var(--t2)}

/* ===== PROGRESSO ===== */
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:3px;background:var(--acc);transition:width .25s ease-out}
.go .bar>i{width:var(--w)}
.bar.warn>i{background:#FF9F0A}.bar.bad>i{background:#FF3B30}
.cat{padding:12px 18px;border-top:.5px solid var(--sep)}
.cat:first-child{border-top:0}
.cat-l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}

/* ===== HOJE ===== */
.hero{padding:20px 20px 16px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero-n{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px;margin:6px 0 14px}
.bm{font-size:48px;font-weight:300;letter-spacing:-.035em;line-height:1.05;white-space:nowrap;font-variant-numeric:tabular-nums}
.bm small{font-size:22px;font-weight:400;margin-right:4px;letter-spacing:0;color:var(--t2)}
.bm em{font-style:normal;font-size:26px;color:var(--t2)}
.bm.neg{color:var(--bad)}.bm.neg small,.bm.neg em{color:inherit}
.wk{text-align:right;padding-bottom:6px}
.mid{font-size:22px;font-weight:400;letter-spacing:-.02em;white-space:nowrap}
.hero-f{border-top:.5px solid var(--sep);padding-top:12px;font-size:14px;color:var(--t2)}
.hero .chips{margin-top:10px}
.date-b{width:40px;text-align:center;flex:none;line-height:1.1}
.date-b b{display:block;font-size:19px;font-weight:600}
.date-b span{font-size:12px;color:var(--t2);text-transform:uppercase}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 12px}

/* ===== MÊS ===== */
.nav{display:flex;gap:4px}
.icb{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--acc)}
.icb:disabled{color:var(--t3)}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum3 b{display:block;font-size:17px;font-weight:400;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-why{font-size:14px;color:var(--t2);margin:12px 0 2px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;border-top:.5px solid var(--sep);font-size:15px}
.prow:first-of-type{border-top:0}
.prow .meta{display:inline}

/* ===== DÍVIDAS ===== */
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.ttl2{font-size:17px;font-weight:600}
.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.dg b{display:block;font-size:16px;font-weight:500;margin-top:2px;white-space:nowrap}
.rank{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.paid{color:var(--t3);text-decoration:line-through}
.ok-t{color:var(--ok)}.warn-t{color:var(--warn)}

/* ===== BARRA INFERIOR ===== */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:4px max(6px,env(safe-area-inset-left,0px)) calc(4px + var(--sb));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
#tabs button{flex:1;max-width:100px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--t2);font-size:11px;font-weight:500;transition:color .15s}
#tabs button.on{color:var(--acc)}
#tabs .ic{width:26px;height:26px}
#fab{position:fixed;z-index:21;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(76px + var(--sb));width:58px;height:58px;border-radius:29px;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,102,214,.32),0 1px 3px rgba(0,0,0,.12);transition:transform .15s}
#fab:active{transform:scale(.94)}
#fab .ic{width:28px;height:28px}
@media (min-width:600px){#fab{right:calc(50% - 262px)}}

/* ===== FOLHA (BOTTOM SHEET) ===== */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:calc(100% - var(--st) - 16px);overflow-y:auto;overscroll-behavior:contain;background:var(--card);border-radius:24px 24px 0 0;padding:6px 16px calc(14px + var(--sb));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:41;box-shadow:0 -4px 30px rgba(0,0,0,.12)}
#sheet.on{transform:none}
#sheet .list .row{padding-left:2px;padding-right:2px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--t3);opacity:.5;margin:2px auto 4px}
.sh-head{display:flex;align-items:center;justify-content:space-between;min-height:46px;gap:8px}
.sh-head h2{font-size:17px;font-weight:600;margin:0;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .link{min-width:60px;text-align:left}.sh-head .link:last-child{text-align:right}
.sh-t{font-size:20px;font-weight:600;margin:14px 0 6px;text-align:center}
.sh-p{color:var(--t2);text-align:center;margin:0 0 18px;font-size:15px}
.amount{text-align:center;font-size:46px;font-weight:300;letter-spacing:-.03em;line-height:1.15;padding:2px 0 0}
.amount small{font-size:22px;color:var(--t2);margin-right:4px;letter-spacing:0}
.hint{text-align:center;font-size:14px;color:var(--t2);min-height:20px;margin-bottom:4px}
#amtHint:empty{min-height:0;margin:0}
.lbl{font-size:13px;color:var(--t2);margin:4px 2px 2px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.kp button{height:50px;border:0;border-radius:14px;background:var(--fill2);font-size:26px;font-weight:400;display:grid;place-items:center;transition:background .1s}
.kp button:active{background:var(--fill)}
.opts{display:flex;gap:8px;align-items:center;margin-top:6px}
.step{display:flex;align-items:center;background:var(--fill2);border-radius:22px;height:44px;flex:none}
.step button{width:40px;height:44px;border:0;background:none;font-size:22px;color:var(--acc)}
.step span{min-width:30px;text-align:center;font-size:15px}
.datec input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0}
.desc{flex:1;min-width:0;height:44px;border:0;border-radius:22px;background:var(--fill2);padding:0 16px;font-size:16px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:13px;color:var(--t2);margin:0 2px 6px}
.field input,.field select{width:100%;border:0;background:var(--fill2);border-radius:12px;min-height:48px;padding:0 14px;font-size:17px;appearance:none;-webkit-appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--t2) 50%),linear-gradient(135deg,var(--t2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.sh-pad{padding:4px 2px 4px}
.tests .row{padding:8px 2px;min-height:44px}

/* ===== CONFIGURAÇÃO INICIAL ===== */
#setup{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto}
.setup-in{max-width:520px;margin:0 auto;padding:calc(var(--st) + 24px) 20px calc(24px + var(--sb));min-height:100%;display:flex;flex-direction:column}
.dots{display:flex;gap:6px;margin-bottom:28px}
.dots i{height:4px;flex:1;border-radius:2px;background:var(--fill)}
.dots i.on,.dots i.done{background:var(--acc)}.dots i.done{opacity:.4}
.setup-in .sub{font-size:16px;margin:8px 0 18px}
.setup-body{flex:1}
.setup-btns{display:flex;flex-direction:column;gap:6px;margin-top:22px}
.logo{width:72px;height:72px;border-radius:18px;margin-bottom:22px;box-shadow:0 6px 18px rgba(0,102,214,.25)}

/* ===== AVISO ===== */
#toast{position:fixed;left:50%;bottom:calc(150px + var(--sb));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:rgba(36,36,38,.94);color:#fff;border-radius:16px;padding:0 6px 0 18px;min-height:48px;font-size:15px;transition:opacity .2s,transform .2s;z-index:60;display:flex;gap:6px;align-items:center;max-width:calc(100% - 32px);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast span{padding-right:12px}
#toast button{background:none;border:0;color:#5EB0FF;font-weight:600;min-height:44px;padding:0 12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs" aria-label="Navegação"></nav>
<button id="fab" data-a="fab" aria-label="Lançar gasto"></button>
<div id="setup" hidden></div>
<div id="scrim" data-a="close"></div>
<section id="sheet" role="dialog" aria-modal="true"></section>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script>
'use strict';
/* =========================================================
   1. UTILITÁRIOS
   ========================================================= */
const $=s=>document.querySelector(s);
const VERSION=2, KEY='financeiro.v1';
const pad2=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
let NOW=null; // data fixa só nos testes
const today=()=>{if(NOW)return D(NOW);const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const dayIn=(y,m,day)=>{const b=new Date(y,m,1);return new Date(b.getFullYear(),b.getMonth(),Math.min(day,dim(b.getFullYear(),b.getMonth())))};
const addMonths=(d,n)=>dayIn(d.getFullYear(),d.getMonth()+n,d.getDate());
const diffDays=(a,b)=>Math.round((b-a)/864e5);
const ddmm=s=>{const d=typeof s==='string'?D(s):s;return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)};
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WDL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const monYear=d=>d?MES[d.getMonth()].slice(0,3)+'/'+d.getFullYear():'—';
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money=v=>BRL.format(Math.abs(v)<0.005?0:v||0);
const r2=v=>Math.round((v+Number.EPSILON)*100)/100;
const sum=(a,k)=>r2(a.reduce((s,x)=>s+(+(k?x[k]:x)||0),0));
let _n=0;const uid=()=>Date.now().toString(36)+(_n++).toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseMoney=s=>{s=String(s??'').trim().replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)||0};
const pct=v=>(v*100).toFixed(1).replace('.',',')+'%';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function bigMoney(v){const neg=v<-0.004;const [i,c]=Math.abs(v).toFixed(2).split('.');return `<span class="bm${neg?' neg':''}">${neg?'−':''}<small>R$</small>${Number(i).toLocaleString('pt-BR')}<em>,${c}</em></span>`}

/* =========================================================
   2. DADOS (localStorage, um objeto com "version")
   ========================================================= */
const DEFAULT_CATS=()=>[['Mercado',350],['Alimentação',300],['Combustível',400],['Transporte',100],['Lazer',150],['Saúde',100],['Casa',100],['Outros',100]].map(([name,limit])=>({id:uid(),name,limit}));
function blank(){
  return{version:VERSION,
    settings:{salary:0,salaryMode:'business',salaryBizDay:5,salaryDay:5,overtimeAvg:0,overtimeDay:28,savePct:15,reserveGoal:1000,reserveSaved:0,mode:'auto',payOffset:3,pix:'',lastBackup:'',setupDone:false,lastCard:''},
    extras:[{id:uid(),name:'Uber',avg:0,freq:'week',weekday:'1'},{id:uid(),name:'Aulas particulares',avg:0,freq:'month',weekday:'1'}],
    fixed:[],
    debts:[{id:uid(),name:'Fatura parcelada',original:0,installment:0,n:0,paid:0,day:10},{id:uid(),name:'Empréstimo Nubank',original:0,installment:0,n:0,paid:0,day:10}],
    cards:['Nubank','Itaú','Magalu','Carrefour','Mufato'].map(name=>({id:uid(),name,owner:'me',close:1,due:10})),
    people:[{id:uid(),name:'Gabi'}],
    categories:DEFAULT_CATS(),goals:[],shortcuts:[],
    expenses:[],incomes:[],payments:[],paid:{},applied:{}};
}
// Migração: completa campos que faltam e sobe a versão (próximas etapas entram aqui)
function migrate(s){
  if(!s||typeof s!=='object')return blank();
  const b=blank();
  for(const k in b)if(s[k]===undefined)s[k]=b[k];
  s.settings={...b.settings,...s.settings};
  // v2: mês passa a começar no 5º dia útil; o salário já recebido acompanha o novo mês
  if(s.version<2){const T=today(),old=rangeBy(T,(y,m)=>dayIn(y,m,s.settings.salaryDay)),nr=rangeBy(T,starter(s.settings)),a=iso(nr.start);
    s.incomes.filter(i=>i.kind==='salary'&&i.date>=iso(old.start)&&i.date<=iso(old.end)).forEach(i=>{if(i.date<a)i.date=a;i.ref='salary:'+a});}
  s.version=VERSION;return s;
}

   3. CÁLCULOS (funções puras, testadas na seção 10)

// Feriados nacionais (fixos + Sexta-feira Santa)
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31);return new Date(y,mo-1,((h+l-7*m+114)%31)+1)}
function isHoliday(d){const k=pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  return ['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'].includes(k)||iso(addDays(easter(d.getFullYear()),-2))===iso(d)}
// N-ésimo dia útil do mês (segunda a sexta, sem feriados nacionais)
function nthBusinessDay(y,m,n){const b=new Date(y,m,1);y=b.getFullYear();m=b.getMonth();let c=0;
  for(let d=1;d<=dim(y,m);d++){const x=new Date(y,m,d),w=x.getDay();if(w>0&&w<6&&!isHoliday(x)&&++c===n)return x}
  return new Date(y,m,dim(y,m));}
// Mês financeiro: começa no dia do salário (dia fixo ou N-ésimo dia útil)
function rangeBy(ref,startOf){
  let s=startOf(ref.getFullYear(),ref.getMonth());
  if(ref<s)s=startOf(ref.getFullYear(),ref.getMonth()-1);
  const next=startOf(s.getFullYear(),s.getMonth()+1);
  return{start:s,end:addDays(next,-1),next};
}
function monthRange(ref,sday){return rangeBy(ref,(y,m)=>dayIn(y,m,sday))}
function starter(st){return(y,m)=>st.salaryMode==='business'?nthBusinessDay(y,m,st.salaryBizDay||5):dayIn(y,m,st.salaryDay)}
const curRange=()=>rangeBy(today(),starter(S.settings));
// Mês deslocado (−1 = anterior) em relação ao atual
function rangeAt(off){const c=curRange(),sf=starter(S.settings);return rangeBy(sf(c.start.getFullYear(),c.start.getMonth()+off),sf)}
// Juros mensal implícito (igual à TAXA do Excel), por bisseção
function pvOf(r,pmt,n){return r?pmt*(1-Math.pow(1+r,-n))/r:pmt*n}
function implicitRate(pv,pmt,n){
  if(!(pv>0&&pmt>0&&n>0)||pmt*n<=pv)return 0;
  let lo=0,hi=1;while(pvOf(hi,pmt,n)>pv&&hi<100)hi*=2;
  for(let i=0;i<200;i++){const m=(lo+hi)/2;if(pvOf(m||1e-12,pmt,n)>pv)lo=m;else hi=m}
  return (lo+hi)/2;
}
// Orçamento diário
function dailyBudget({income,fixed,installments,reserve,spentBefore,spentToday,daysLeft}){
  const avail=income-fixed-installments-reserve-spentBefore;
  const daily=daysLeft>0?Math.max(0,avail)/daysLeft:0;
  return{avail:r2(avail),daily:r2(daily),today:r2(daily-spentToday)};
}
// Abatimento: pagamento abate do item mais antigo; parcial deixa o resto
function allocatePayments(items,total){
  let left=r2(Math.max(0,total));
  const out=items.map(it=>{const p=Math.min(it.amount,left);left=r2(left-p);return{...it,paid:r2(p),left:r2(it.amount-p)}});
  return{items:out,credit:left};
}
// Pix com cartão escolhido: abate primeiro as compras daquele cartão (mais antigas antes);
// o que sobrar vai para o item mais antigo de qualquer cartão. Itens já vêm em ordem.
function allocateByCard(items,payments){
  const out=items.map(it=>({...it,paid:0,left:it.amount}));let credit=0;
  const take=(list,amt)=>{for(const it of list){if(amt<=0)break;const p=Math.min(it.left,amt);it.paid=r2(it.paid+p);it.left=r2(it.left-p);amt=r2(amt-p)}return amt};
  [...payments].sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{let amt=r2(Math.max(0,p.amount));
    if(p.card)amt=take(out.filter(i=>(i.cardId||'')===p.card),amt);credit=r2(credit+take(out,amt))});
  return{items:out,credit};
}
// Divisão da sobra por prioridade: reserva → dívida mais cara → metas → investimento
function splitPlan(amount,o){
  let left=r2(Math.max(0,amount));const out={reserva:0,divida:0,metas:0,investir:0};
  out.reserva=r2(Math.min(left,o.reserveGap||0));left=r2(left-out.reserva);
  if(o.hasDebt){out.divida=o.mode==='foco'?left:r2(left*.9);left=r2(left-out.divida)}
  out.metas=r2(Math.min(left,o.goalsNeed||0));left=r2(left-out.metas);
  out.investir=left;return out;
}
function autoMode(rate,tight){
  if(rate>0.04)return{mode:'foco',why:`Foco: a dívida mais cara cobra ${pct(rate)} ao mês, acima de 4%.`};
  if(tight)return{mode:'foco',why:'Foco: o mês está apertado, então a sobra vai toda para a dívida.'};
  return{mode:'equilibrado',why:'Equilibrado: juros abaixo de 4% ao mês e mês sob controle.'};
}
// Próxima data com aquele dia do mês (a partir de ref)
function nextOcc(day,ref){let x=dayIn(ref.getFullYear(),ref.getMonth(),day);if(x<ref)x=dayIn(ref.getFullYear(),ref.getMonth()+1,day);return x}
// Vencimento da fatura em que a compra cai (compra no dia do fechamento vai para a próxima)
function invoiceDue(card,p){
  const d=typeof p==='string'?D(p):p;
  const close=dayIn(d.getFullYear(),d.getMonth()+(d.getDate()>=card.close?1:0),card.close);
  return dayIn(close.getFullYear(),close.getMonth()+(card.due<=card.close?1:0),card.due);
}
function invoiceTotal(card,due){const k=iso(due);return sum(S.expenses.filter(e=>e.card===card.id&&iso(invoiceDue(card,e.date))===k),'amount')}
const myShare=e=>e.owner==='me'?1:e.owner==='split'?(e.share??.5):0;
// Cria a compra e as parcelas futuras (herdam dono, cartão e categoria)
function makeExpenses(o){
  const n=Math.max(1,o.n|0),g=n>1?uid():null,each=Math.floor(o.amount*100/n)/100,out=[];
  for(let i=0;i<n;i++)out.push({id:uid(),date:iso(addMonths(D(o.date),i)),amount:i===n-1?r2(o.amount-each*(n-1)):each,cat:o.cat,card:o.card||'',owner:o.owner,
    with:o.owner==='split'?o.with:undefined,share:o.owner==='split'?.5:undefined,desc:o.desc||'',parcel:g?{g,i:i+1,n}:undefined});
  return out;
}
// Dívidas
function debtInfo(d){
  const ok=d.n>0&&d.installment>0&&d.original>0,rate=ok?implicitRate(d.original,d.installment,d.n):0,left=Math.max(0,d.n-d.paid);
  return{...d,ok,rate,left,bal:ok?r2(pvOf(rate,d.installment,left)):0,end:ok&&left>0?addMonths(nextOcc(d.day||10,today()),left-1):null};
}
const debtsSorted=()=>S.debts.map(debtInfo).sort((a,b)=>(b.ok-a.ok)||(b.rate-a.rate));
const activeDebts=()=>debtsSorted().filter(d=>d.ok&&d.left>0);

// Resumo do mês (orçamento, categorias, status)
function stats(R=curRange()){
  const s=S.settings,a=iso(R.start),b=iso(R.end),T=today(),t=iso(T),inR=x=>x>=a&&x<=b;
  const income=sum(S.incomes.filter(i=>inR(i.date)),'amount');
  const fixed=sum(S.fixed,'amount'),debtInst=sum(activeDebts(),'installment');
  let parcels=0,spentBefore=0,spentToday=0,others=0,mine=0;const cat={};
  for(const e of S.expenses){if(!inR(e.date))continue;const m=e.amount*myShare(e);others+=e.amount-m;mine+=m;if(!m)continue;
    cat[e.cat]=(cat[e.cat]||0)+m;
    if(e.parcel&&e.parcel.i>1)parcels+=m;else if(e.date===t)spentToday+=m;else spentBefore+=m;}
  const committed=r2(fixed+debtInst+parcels),free=r2(income-committed),reserve=free>0?r2(free*s.savePct/100):0;
  const totalDays=diffDays(R.start,R.end)+1,daysLeft=clamp(diffDays(T,R.end)+1,0,totalDays);
  const B=dailyBudget({income,fixed,installments:debtInst+parcels,reserve,spentBefore,spentToday,daysLeft});
  const pool=r2(free-reserve),ideal=pool/totalDays;
  const weekDays=Math.min(daysLeft,7-((T.getDay()+6)%7));
  const spentVar=spentBefore+spentToday,elapsed=Math.max(1,totalDays-daysLeft+1);
  const projected=r2(pool-spentVar-spentVar/elapsed*Math.max(0,daysLeft-1));
  let status='ok';
  if(pool<=0||B.today<=0)status='bad';else{const q=B.daily/ideal;status=q>=.85?'ok':q>=.5?'warn':'bad'}
  if(income<=0)status='n';
  return{R,income,fixed,debtInst,parcels:r2(parcels),committed,free,reserve,pool,mine:r2(mine),others:r2(others),cat,
    spentToday:r2(spentToday),daysLeft,totalDays,...B,week:r2(B.daily*weekDays-spentToday),projected,status};
}
// Vencimentos (contas fixas, parcelas de dívida, faturas)
function upcoming(days=7){
  const T=today(),lim=addDays(T,days),out=[];
  const add=(kind,id,name,date,amount,sub)=>{const key=`${kind}:${id}:${iso(date)}`;if(date<=lim&&!S.paid[key]&&amount>0)out.push({kind,id,name,sub,date:iso(date),amount,key,days:diffDays(T,date)})};
  S.fixed.forEach(f=>add('fixo',f.id,f.name,nextOcc(f.day,T),f.amount,'Conta fixa'));
  activeDebts().forEach(d=>add('divida',d.id,d.name,nextOcc(d.day,T),d.installment,`Parcela ${d.paid+1}/${d.n}`));
  S.cards.forEach(c=>{const due=nextOcc(c.due,T);add('fatura',c.id,'Fatura '+c.name,due,invoiceTotal(c,due),'Cartão')});
  return out.sort((x,y)=>x.date.localeCompare(y.date));
}
// Acertos por pessoa
function personItems(pid){
  const off=S.settings.payOffset,items=[];
  for(const e of S.expenses){
    const sh=e.owner===pid?1:(e.owner==='split'&&e.with===pid?1-(e.share??.5):0);if(!sh)continue;
    const card=S.cards.find(c=>c.id===e.card);
    items.push({id:e.id,e,date:e.date,pay:card?iso(addDays(invoiceDue(card,e.date),-off)):e.date,amount:r2(e.amount*sh),card,cardId:e.card||'',parcel:e.parcel});
  }
  items.sort((x,y)=>x.pay.localeCompare(y.pay)||x.date.localeCompare(y.date));
  return allocateByCard(items,S.payments.filter(p=>p.pid===pid));
}
function personSummary(pid,R=curRange()){
  const {items,credit}=personItems(pid),a=iso(R.start),b=iso(R.end),t=iso(today());
  const prev=items.filter(i=>i.pay<a),cur=items.filter(i=>i.pay>=a&&i.pay<=b),lateI=items.filter(i=>i.pay<t&&i.left>0.004);
  return{items,prev,cur,credit,prevLeft:sum(prev,'left'),curTotal:sum(cur,'amount'),curLeft:sum(cur,'left'),
    due:sum(items.filter(i=>i.pay<=b),'left'),late:sum(lateI,'left')};
}

// Média dos 3 últimos recebimentos (hora extra ou renda extra); senão o valor configurado
function learnedAvg(key,fallback){
  const l=S.incomes.filter(i=>key==='overtime'||key==='salary'?i.kind===key:i.xid===key).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
  return l.length?r2(sum(l,'amount')/l.length):fallback||0;
}
// Rendas previstas do mês (só contam quando marcadas como recebidas)
function expected(R){
  const s=S.settings,a=iso(R.start),b=iso(R.end),inc=S.incomes.filter(i=>i.date>=a&&i.date<=b),out=[];
  {const sv=learnedAvg('salary',s.salary);if(sv>0)out.push({ref:'salary:'+a,kind:'salary',name:'Salário',date:a,amount:sv})}
  const ot=learnedAvg('overtime',s.overtimeAvg);
  if(ot>0)out.push({ref:'overtime:'+a,kind:'overtime',name:'Hora extra',date:iso(dayIn(R.start.getFullYear(),R.start.getMonth()+(s.overtimeDay<R.start.getDate()?1:0),s.overtimeDay)),amount:ot});
  S.extras.filter(x=>x.freq==='week').forEach(x=>{const av=learnedAvg(x.id,x.avg);
    for(let d=new Date(R.start);d<=R.end;d=addDays(d,1))if(d.getDay()===+x.weekday)out.push({ref:x.id+':'+iso(d),kind:'extra',xid:x.id,name:x.name,date:iso(d),amount:av});});
  // Salário e hora extra: um por mês, mesmo se o dia mudar depois
  return out.map(o=>({...o,received:inc.some(i=>i.ref===o.ref||(o.kind!=='extra'&&i.kind===o.kind))})).sort((x,y)=>x.date.localeCompare(y.date));
}
// Categorias ordenadas pelo uso nos últimos 60 dias
function catsByUse(){
  const lim=iso(addDays(today(),-60)),n={};S.expenses.forEach(e=>{if(e.date>=lim&&!(e.parcel&&e.parcel.i>1))n[e.cat]=(n[e.cat]||0)+1});
  return[...S.categories].sort((a,b)=>(n[b.id]||0)-(n[a.id]||0));
}
// Atalhos: os seus + gastos repetidos 3 vezes ou mais em 90 dias
function shortcuts(){
  const list=S.shortcuts.filter(x=>x.amount>0),lim=iso(addDays(today(),-90)),cnt={};
  S.expenses.filter(e=>e.date>=lim&&!e.parcel&&e.desc).forEach(e=>{const k=[e.desc.toLowerCase(),e.amount,e.cat,e.card,e.owner,e.with||''].join('|');(cnt[k]=cnt[k]||{n:0,e}).n++});

  return list.slice(0,8);
}

function expRow(e){const c=catName(e.cat),mine=myShare(e)>0;
  const meta=[c,cardName(e.card),e.owner!=='me'?ownerLabel(e):'',e.parcel?`${e.parcel.i}/${e.parcel.n}`:''].filter(Boolean).join(' · ');
  return `<button class=row data-a=exp data-id="${e.id}"><span class=av>${esc(c[0])}</span><span class=grow><span class=ttl>${esc(e.desc||c)}</span><span class=meta>${esc(meta)}</span></span><span class="amt num ${mine?'':'t2'}">${money(e.amount)}</span></button>`}
function plan(st){
  const s=S.settings,worst=activeDebts()[0];let mode=s.mode,why;
  if(!worst){mode='equilibrado';why='Sem dívidas ativas: a sobra vai para reserva, metas e investimento.'}
  else if(mode==='auto'){const r=autoMode(worst.rate,st.status==='bad');mode=r.mode;why=r.why}
  else why=mode==='foco'?'Foco: depois da reserva, tudo vai para a dívida mais cara.':'Equilibrado: depois da reserva, 90% para a dívida e 10% para metas.';
  const goalsNeed=sum(S.goals.map(g=>Math.max(0,g.target-g.saved)));
  return{...splitPlan(st.reserve,{reserveGap:Math.max(0,s.reserveGoal-s.reserveSaved),mode,hasDebt:!!worst,goalsNeed}),mode,why,worst};
}

  pixCard:id=>{pad.card=id;pad.buf=toBuf(pixDue(pad.pid,id));$('#sheet').innerHTML='<div class=grab></div>'+pixHTML();updAmt()},
  delPay:id=>{const p=S.payments.find(x=>x.id===id);ask('Excluir Pix?',`${money(p.amount)} em ${ddmm(p.date)}`,'Excluir',()=>change('Pix excluído',()=>{S.payments=S.payments.filter(x=>x.id!==id)}),true)},
  payInst:id=>{const d=S.debts.find(x=>x.id===id);change(`Parcela ${d.paid+1}/${d.n} paga`,()=>{d.paid=Math.min(d.n,d.paid+1);S.paid[`divida:${id}:${iso(nextOcc(d.day,today()))}`]=1})},
  form:id=>openForm(id),
  saveForm:id=>{const fields=FORMS[id].f;
    if(id==='salary')changeSalaryDay(()=>readForm($('#frm'),fields,S.settings));else readForm($('#frm'),fields,S.settings);
    save();closeSheet();render();toast('Salvo')},
  list:k=>openList(k),
  add:(k,el)=>openEdit(k,null,el.dataset.ctx||''),
  edit:(k,el)=>openEdit(k,el.dataset.item,el.dataset.ctx||''),
  back:(k,el)=>{const c=el.dataset.ctx;if(c==='list')openList(k);else closeSheet()},
  saveItem:(k,el)=>{const L=LISTS[k],id=el.dataset.item,x=id?S[k].find(i=>i.id===id):{id:uid(),...L.def};readForm($('#frm'),L.f,x);
    if(!(x.name||x.desc))return toast('Dê um nome');if(k==='debts')x.paid=Math.min(x.paid,x.n||x.paid);if(!id)S[k].push(x);save();afterItem(k,el.dataset.ctx);toast('Salvo')},
  delItem:(k,el)=>{const id=el.dataset.item,ctx=el.dataset.ctx;S[k]=S[k].filter(i=>i.id!==id);save();afterItem(k,ctx);toast('Excluído')},
  export:()=>exportBackup(),import:()=>$('#file').click(),
  example:()=>loadExample(),setup:()=>renderSetup(0),
  wipe:()=>ask('Apagar tudo?','Todos os dados deste aparelho serão apagados. Faça um backup antes.','Apagar tudo',()=>{S=blank();save();ui.tab='hoje';render(true);renderSetup(0)},true),
  tests:()=>showTests(),
  wizNext:()=>{const st=STEPS[step];if(st.form)readForm($('#wizf'),FORMS[st.form].f,S.settings);save();if(step>=STEPS.length-1)return wizEnd();renderSetup(step+1)},
  wizSkip:()=>{if(step>=STEPS.length-1)return wizEnd();renderSetup(step+1)},
  wizEnd:()=>wizEnd()};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(f){ev.preventDefault();f(el.dataset.id,el)}});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='file'&&t.files[0]){importBackup(t.files[0]);t.value=''}
  if(t.id==='expDate'&&t.value){draft.date=t.value;rerenderExp()}
  if(t.id==='expDesc'){draft.desc=t.value;if(!draft.cat){const c=guessCat(t.value);if(c){draft.cat=c;rerenderExp()}}}});
document.addEventListener('input',ev=>{if(ev.target.id==='expDesc')draft.desc=ev.target.value});
document.addEventListener('click',ev=>{if(ev.target.id==='expDate'){try{ev.target.showPicker()}catch(e){}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
// Arrastar a folha para baixo fecha
(()=>{const sh=$('#sheet');let y0=null,dy=0;
  sh.addEventListener('touchstart',e=>{y0=sh.scrollTop<=0&&e.target.closest('.grab,.sh-head,.amount,.hint')?e.touches[0].clientY:null;dy=0},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transition='none';sh.style.transform=`translateY(${dy}px)`},{passive:true});
  sh.addEventListener('touchend',()=>{if(y0==null)return;sh.style.transition='';sh.style.transform='';if(dy>90)closeSheet();y0=null})})();

/* =========================================================
   10. TESTES (sem framework) — Ajustes › Testes ou #testes
   ========================================================= */
function runTests(){
  const T=[],ok=(name,cond,info='')=>T.push({name,ok:!!cond,info}),near=(a,b,t=1e-6)=>Math.abs(a-b)<=t;
  // Juros implícito (TAXA)
  let r=implicitRate(1000,100,12);ok('TAXA(12; -100; 1000) = 2,9229%',near(r,0.0292285,1e-6),pct(r));
  r=implicitRate(2400,289.9,12);ok('Ida e volta: VP das parcelas = valor original',near(pvOf(r,289.9,12),2400,1e-4),pct(r));
  ok('Sem juros quando parcela × n = valor',implicitRate(1200,100,12)===0);
  ok('Dados incompletos dão 0',implicitRate(0,100,12)===0&&implicitRate(1000,0,12)===0);
  // Orçamento diário
  let b=dailyBudget({income:2000,fixed:500,installments:300,reserve:200,spentBefore:400,spentToday:20,daysLeft:20});
  ok('Orçamento: (2000−500−300−200−400)÷20 = 30/dia',b.daily===30&&b.avail===600);ok('Hoje desconta o gasto de hoje: 30−20 = 10',b.today===10);
  b=dailyBudget({income:500,fixed:600,installments:0,reserve:0,spentBefore:0,spentToday:15,daysLeft:10});ok('Saldo negativo: diário 0 e hoje −15',b.daily===0&&b.today===-15);
  // Abatimento de pagamentos
  const it=[{amount:100},{amount:50},{amount:30}];
  let a=allocatePayments(it,120);ok('Pix de 120 quita o mais antigo e abate 20 do segundo',a.items[0].left===0&&a.items[1].left===30&&a.items[2].left===30);
  a=allocatePayments(it,200);ok('Pagamento a mais vira crédito de 20',a.credit===20&&a.items.every(x=>x.left===0));
  a=allocatePayments(it,0);ok('Sem pagamento, tudo pendente',sum(a.items,'left')===180);
  const ic3=[{amount:100,cardId:'nu'},{amount:80,cardId:'mg'},{amount:60,cardId:'mg'}];
  a=allocateByCard(ic3,[{date:'2026-11-10',amount:100,card:'mg'}]);ok('Pix de 100 "do Magalu" abate só o Magalu (80 + 20), Nubank intacto',a.items[0].left===100&&a.items[1].left===0&&a.items[2].left===40);
  a=allocateByCard(ic3,[{date:'2026-11-10',amount:170,card:'mg'}]);ok('Pix do Magalu maior que a dívida no Magalu: sobra 30 vai para o Nubank',a.items[0].left===70&&a.items[2].left===0);
  a=allocateByCard(ic3,[{date:'2026-11-10',amount:120,card:''}]);ok('Pix sem cartão abate do mais antigo',a.items[0].left===0&&a.items[1].left===60);
  // Mês financeiro, faturas e plano
  let m=monthRange(D('2026-11-03'),4);ok('Dia 03/11 pertence ao mês 04/10–03/11',iso(m.start)==='2026-10-04'&&iso(m.end)==='2026-11-03');
  m=monthRange(D('2026-02-28'),31);ok('Salário dia 31 em fevereiro cai em 28/02',iso(m.start)==='2026-02-28');
  ok('5º dia útil de nov/2026 = 09/11 (pula Finados)',iso(nthBusinessDay(2026,10,5))==='2026-11-09');
  ok('5º dia útil de jan/2027 = 08/01 (pula Ano Novo)',iso(nthBusinessDay(2027,0,5))==='2027-01-08');
  ok('5º dia útil de abr/2026 = 08/04 (pula Sexta-feira Santa)',iso(nthBusinessDay(2026,3,5))==='2026-04-08');
  m=rangeBy(D('2026-11-08'),(y,mm)=>nthBusinessDay(y,mm,5));ok('Dia 08/11 ainda é do mês que começou no 5º dia útil de outubro',iso(m.start)==='2026-10-07'&&iso(m.end)==='2026-11-08');
  const c={close:3,due:10};ok('Compra 20/10 (fecha 3, vence 10) → fatura 10/11',iso(invoiceDue(c,'2026-10-20'))==='2026-11-10');
  ok('Compra no dia do fechamento vai para a próxima',iso(invoiceDue(c,'2026-11-03'))==='2026-12-10');
  ok('Vencimento antes do fechamento → mês seguinte',iso(invoiceDue({close:27,due:5},'2026-10-10'))==='2026-11-05');
  const ex=makeExpenses({date:'2026-01-31',amount:100,n:3,cat:'x',owner:'g1'});ok('3 parcelas: 33,33+33,33+33,34 e datas mensais',ex[2].amount===33.34&&ex[1].date==='2026-02-28'&&ex.every(e=>e.owner==='g1'));
  let sp=splitPlan(500,{reserveGap:200,mode:'foco',hasDebt:true,goalsNeed:1000});ok('Foco: reserva 200, dívida 300',sp.reserva===200&&sp.divida===300&&sp.metas===0);
  sp=splitPlan(500,{reserveGap:200,mode:'equilibrado',hasDebt:true,goalsNeed:1000});ok('Equilibrado: dívida 270, metas 30',sp.divida===270&&sp.metas===30);
  ok('Automático: juros 5% → Foco',autoMode(.05,false).mode==='foco');ok('Automático: juros 2% e mês ok → Equilibrado',autoMode(.02,false).mode==='equilibrado');
  return T;
}
function showTests(){const T=runTests(),bad=T.filter(t=>!t.ok).length;console.table(T);
  openSheet(`<div class=sh-head><span class=w60></span><h2>Testes de cálculo</h2><button class=link data-a=close>OK</button></div><div class=hint>${bad?bad+' falharam':'Todos os '+T.length+' passaram'}</div><div class="list tests">${T.map(t=>`<div class=row><span class="dot ${t.ok?'ok':'bad'}"></span><span class="grow wrap">${esc(t.name)}${t.info?` <span class=t2>(${esc(t.info)})</span>`:''}</span></div>`).join('')}</div>`)}
